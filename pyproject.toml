[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "referral-finder"
version = "0.1.0"
description = "Telegram referral lead finder. Stage 1: project skeleton only (no Telegram connection yet)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    # Telethon 1.x is the stable API used by this project. The patch-only range
    # keeps behavior reproducible while still allowing compatible bug fixes.
    "telethon~=1.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: tests that require a real Telegram connection (excluded by default)",
]
